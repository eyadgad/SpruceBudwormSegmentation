# Linear probe on frozen S0: scan-level BCE only.
# Encoder/decoder stay at night_base_attunet9 weights. Only cls_fc is trained.

data:
  root: "Data"
  cleaned_subdir: "Cleaned_Date_2013_2019"
  matched_csv: "matched_samples.csv"
  artifacts_dir: "artifacts_night"
  targets_dir: "artifacts/targets"

split:
  mode: night
  fractions:
    train: 0.70
    val:   0.20
    test:  0.10
  seed: 42

channels:
  - th_e0
  - th_e1
  - th_e2
  - th_e3
  - th_e4
  - th_e5
  - th_e6
  - th_e7
  - th_e8
  - valid_mask

target:
  mode: threshold
  dbz_threshold: 0.0
  soft_sigma: 0.0

negatives:
  include: true
  balanced: true
  ratio: 1.0

patch:
  size: 256
  patches_per_image: 1
  pos_sample_rate: 0.5
  hard_pos_rate: 0.3

train:
  epochs: 30
  batch_size: 8
  lr: 1.0e-3
  weight_decay: 1.0e-4
  warmup_epochs: 2
  patience: 10
  es_tolerance: 1.0e-4
  amp: true
  amp_dtype: bfloat16
  accum_steps: 1
  num_workers: 0
  pin_memory: false
  snapshot_every: 1
  scene_cache: 8
  seed: 42

augment:
  enabled: true
  hflip: true
  vflip: true
  rot90: true

eval:
  patch_size: 256
  overlap: 0.5
  tta: false
  threshold_range: [0.005, 0.01, 0.02, 0.03, 0.05, 0.08, 0.1, 0.15, 0.2, 0.25, 0.3, 0.4, 0.5, 0.6, 0.7, 0.8, 0.9]
  defer_test: true
  gate: "hard"

model:
  name: attention_unet
  base_filters: 32
  cls_head: true
  img_size: 384
  init_checkpoint: outputs/night_split/checkpoints/night_base_attunet9_best.pt
  freeze_backbone: true

loss:
  name: bce

output_dir: "outputs/night_cascade"
