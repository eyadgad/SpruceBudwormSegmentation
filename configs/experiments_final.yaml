experiments:
- name: sweep_unetpp_dbz0_e012345678_focaltv
  channels:
  - th_e0
  - th_e1
  - th_e2
  - th_e3
  - th_e4
  - th_e5
  - th_e6
  - th_e7
  - th_e8
  - valid_mask
  model:
    name: smp_unetpp
    encoder: efficientnet-b2
    pretrained: true
  loss:
    name: focal_tversky
    alpha: 0.3
    beta: 0.7
    gamma: 1.333
  target:
    mode: threshold
    dbz_threshold: 0.0
  train:
    epochs: 100
    accum_steps: 2
  patch:
    patches_per_image: 8
  eval:
    tta: false
- name: sweep_attunet_dbz0_e012345678_focaltv
  channels:
  - th_e0
  - th_e1
  - th_e2
  - th_e3
  - th_e4
  - th_e5
  - th_e6
  - th_e7
  - th_e8
  - valid_mask
  model:
    name: attention_unet
    base_filters: 32
  loss:
    name: focal_tversky
    alpha: 0.3
    beta: 0.7
    gamma: 1.333
  target:
    mode: threshold
    dbz_threshold: 0.0
  train:
    epochs: 100
  patch:
    patches_per_image: 8
  eval:
    tta: false
