# Base configuration for the LEAKAGE-FREE NIGHT-SPLIT experiments.
#
# Differs from base_config.yaml only where the night-split protocol requires it.
# Everything else (channels superset, patch geometry, optimizer, eval protocol)
# is deliberately identical so night-split results stay comparable to the
# historical runs in shape, if not in absolute value.
#
# Writes to a SEPARATE artifacts directory. artifacts/ holds the manifest and
# norm_stats of the old scan-level split; overwriting them would make the
# published dashboard model unreproducible, and norm_stats must be recomputed
# from the new train split or normalization itself leaks.

data:
  root: "Data"
  cleaned_subdir: "Cleaned_Date_2013_2019"
  matched_csv: "matched_samples.csv"
  artifacts_dir: "artifacts_night"
  # The mask cache is keyed by timestamp and is split-independent, so reuse the
  # existing one instead of re-extracting 1579 targets from the netCDF volumes.
  targets_dir: "artifacts/targets"

# Whole operational nights (UTC noon-to-noon) are assigned to exactly one split.
# The radar samples the same moth exodus every ~30 min, so a scan-level split
# puts correlated scans in train and test; on this corpus 172 of 248 nights
# (69%) currently span more than one split. See src/nights.py.
split:
  mode: night
  fractions:
    train: 0.70
    val:   0.20
    test:  0.10
  seed: 42

# Channels of the selected model sweep_attunet_dbz0_e012345678_focaltv.
# Experiments override this; kept here so data prep has a sane default.
channels:
  - th_e0
  - th_e1
  - th_e2
  - th_e3
  - th_e4
  - th_e5
  - th_e6
  - th_e7
  - th_e8
  - valid_mask

# dbZ >= 0 target, as used by the selected model.
target:
  mode: threshold
  dbz_threshold: 0.0
  soft_sigma: 0.0

negatives:
  include: true
  ratio: 0.3

patch:
  size: 256
  patches_per_image: 8     # matches the selected model
  pos_sample_rate: 0.5
  hard_pos_rate: 0.3

train:
  epochs: 100
  batch_size: 8
  lr: 3.0e-4
  weight_decay: 1.0e-5
  warmup_epochs: 3
  patience: 50           # ACTIVE here. base_config has patience == epochs, which
                         # makes early stopping unreachable.
  es_tolerance: 1.0e-3
  amp: true
  amp_dtype: bfloat16
  accum_steps: 1
  num_workers: 0
  pin_memory: false
  snapshot_every: 1      # every epoch: at ~17 min/epoch a lost snapshot is
                         # expensive, and the ~95 MB write is noise against the
                         # I/O this run already does. Interrupting or rebooting
                         # then costs at most one epoch.
  scene_cache: 48        # temporal stages hold ~3 scenes per visited scene
  seed: 42               # seeds torch/numpy/random; see experiment.seed_everything

augment:
  enabled: true
  hflip: true
  vflip: true
  rot90: true

eval:
  patch_size: 256
  overlap: 0.5
  tta: false             # matches the selected model
  gaussian_window: true
  boundary_metrics: true
  nsd_tolerance: 2.0
  threshold_range: [0.15, 0.2, 0.25, 0.3, 0.35, 0.4, 0.45, 0.5, 0.55, 0.6]
  calib_max_scenes: 50
  # Hold the test set back until every architecture/lambda/threshold decision is
  # frozen. Training runs then report val_full_scene only; `python -m src.finalize`
  # produces test numbers in one deliberate pass.
  defer_test: true

model:
  name: attention_unet
  base_filters: 32

loss:
  name: focal_tversky
  alpha: 0.3
  beta: 0.7
  gamma: 1.333

output_dir: "outputs/night_split"

data_prep:
  norm_max_scenes: 200
  norm_channels:
    - th_e0
    - th_e1
    - th_e2
    - th_e3
    - th_e4
    - th_e5
    - th_e6
    - th_e7
    - th_e8
    - th_e9
    - height_e0
    - dem
    - bh_e0
