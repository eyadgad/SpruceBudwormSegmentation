# One-model cascade behaviour + two-model cascade outputs.
# Balanced night split. Isolated from S0–S3b and the soft-gate hybrids.

data:
  root: "Data"
  cleaned_subdir: "Cleaned_Date_2013_2019"
  matched_csv: "matched_samples.csv"
  artifacts_dir: "artifacts_night"
  targets_dir: "artifacts/targets"

split:
  mode: night
  fractions:
    train: 0.70
    val:   0.20
    test:  0.10
  seed: 42

channels:
  - th_e0
  - th_e1
  - th_e2
  - th_e3
  - th_e4
  - th_e5
  - th_e6
  - th_e7
  - th_e8
  - valid_mask

target:
  mode: threshold
  dbz_threshold: 0.0
  soft_sigma: 0.0

negatives:
  include: true
  balanced: true
  ratio: 1.0

patch:
  size: 256
  patches_per_image: 8
  pos_sample_rate: 0.5
  hard_pos_rate: 0.3

train:
  epochs: 50
  batch_size: 8
  cls_batch_size: 4
  lr: 1.0e-4
  weight_decay: 1.0e-5
  warmup_epochs: 3
  patience: 999
  es_tolerance: 1.0e-3
  amp: true
  amp_dtype: bfloat16
  accum_steps: 1
  num_workers: 0
  pin_memory: false
  snapshot_every: 1
  scene_cache: 16
  seed: 42

augment:
  enabled: true
  hflip: true
  vflip: true
  rot90: true

eval:
  patch_size: 256
  overlap: 0.5
  tta: false
  gaussian_window: true
  boundary_metrics: true
  nsd_tolerance: 2.0
  threshold_range: [0.15, 0.2, 0.25, 0.3, 0.35, 0.4, 0.45, 0.5, 0.55, 0.6]
  cls_threshold_range: [1.0e-6, 2.2e-6, 4.6e-6, 1.0e-5, 2.2e-5, 4.6e-5, 1.0e-4, 2.2e-4, 4.6e-4, 1.0e-3, 2.2e-3, 4.6e-3, 1.0e-2, 2.2e-2, 4.6e-2, 1.0e-1, 2.2e-1, 4.6e-1, 9.0e-1]
  cls_r_min: 0.98
  calib_max_scenes: 50
  defer_test: true
  gate: "hard"

model:
  name: attention_unet
  base_filters: 32
  cls_head: true
  img_size: 384

loss:
  name: focal_tversky
  alpha: 0.3
  beta: 0.7
  gamma: 1.333
  uncertainty_weight: true

output_dir: "outputs/night_cascade"
