# MACHINE B — reference spatial baseline only: 5 U-Net seeds (~53 h).
#
# Run this FIRST on machine B, then the 4 Swin classifier seeds
# (configs/experiments_cls_seeds.yaml, ~25 h) -- together ~78 h, against
# machine A's ~106 h. B still finishes first, so the extra two U-Net seeds
# cost nothing in wall-clock time; they come out of B's idle slack.
#
# Machine B does NOT publish the split. It pulls artifacts_night/ from the
# mirror and verifies the manifest SHA-256 before training, so it must start
# AFTER machine A has printed its "[manifest] sha256=..." line. Starting early
# with no mirrored manifest exits with a clear message rather than building a
# different split.

_unet: &unet
  channels: [th_e0, th_e1, th_e2, th_e3, th_e4, th_e5, th_e6, th_e7, th_e8, valid_mask]
  model:  {name: unet, base_filters: 32}
  loss:   {name: focal_tversky, alpha: 0.3, beta: 0.7, gamma: 1.333}
  target: {mode: threshold, dbz_threshold: 0.0}
  patch:  {patches_per_image: 8}
  eval:   {tta: false, gate: "off", defer_test: true}

experiments:
  - name: unet_night_s42
    <<: *unet
    train: {epochs: 100, patience: 50, seed: 42}
  - name: unet_night_s43
    <<: *unet
    train: {epochs: 100, patience: 50, seed: 43}
  - name: unet_night_s44
    <<: *unet
    train: {epochs: 100, patience: 50, seed: 44}
  - name: unet_night_s45
    <<: *unet
    train: {epochs: 100, patience: 50, seed: 45}
  - name: unet_night_s46
    <<: *unet
    train: {epochs: 100, patience: 50, seed: 46}
